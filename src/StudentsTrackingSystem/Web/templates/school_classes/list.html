{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Классы — {{ year.name }}</h1>
    <a href="{% url 'school_class_create' year_id %}" class="btn-primary">+ Добавить класс</a>
</div>

<p class="breadcrumb">
    <a href="{% url 'school_years' %}">Учебные годы</a> / {{ year.name }}
</p>

{% if classes %}
<table class="table">
    <thead>
        <tr>
            <th>Класс</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for c in classes %}
        <tr>
            <td>{{ c.number }}{{ c.letter }}</td>
            <td>
                <a href="{% url 'school_class_edit' year_id c.id %}"
                    class="breadcrumb">Изменить</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p class="empty">Классов пока нет.</p>
{% endif %}

<a href="{% url 'school_years' %}">← К учебным годам</a>
{% endblock %}
